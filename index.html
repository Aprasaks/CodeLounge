<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="dark-mode">
    <header class="top-header">
      <div class="logo">CodeLounge</div>
      <a href="login.html" class="login-btn">로그인</a>
    </header>

    <main>
      <header class="hero">
        <h1>Welcome to <span class="logo">CodeLounge</span></h1>
        <p>실시간으로 함께 코딩하는 공간. 협업의 즐거움을 느껴보세요.</p>
        <a href="rooms.html" class="btn-start">시작하기 →</a>

      <section class="features">
        <div class="feature">
          <h2>💬 실시간 협업</h2>
          <p>여러 명이 동시에 코드를 입력하고 결과를 확인할 수 있어요.</p>

        <div class="feature">
          <h2>📦 다양한 코드방</h2>
          <p>Todo 리스트부터 계산기까지 원하는 주제의 코드방을 만들 수 있어요.</p>
        </div>
        <div class="feature">
          <h2>⚡ 즉시 미리보기</h2>
          <p>HTML/CSS/JS 결과를 실시간으로 바로 확인하세요.</p>
        </div>
      </section>
    </main>
    <footer>
      <p>&copy; 2025 CodeLounge. All rights reserved.</p>
    </footer>
