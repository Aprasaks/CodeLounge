<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge - Room</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 id="roomTitle">방 제목 불러오는 중...</h1>
      <p id="roomCreator">생성자:</p>
      <p id="roomCreatedAt">생성 시간:</p>
    </div>
    <div class="editor-container">
      <h3>HTML</h3>
      <textarea id="htmlCode" placeholder="HTML 코드 입력"></textarea>
      <h3>CSS</h3>
      <textarea id="cssCode" placeholder="CSS 코드 입력"></textarea>
      <h3>JavaScript</h3>
      <textarea id="jsCode" placeholder="JS 코드 입력"></textarea>
    </div>
    <h3>미리보기</h3>
    <iframe
      id="preview"
      sandbox="allow-scripts"
      style="width: 100%; height: 300px; border: 1px solid #ccc"
    ></iframe>
    <script src="room.js"></script>
  </body>
</html>
