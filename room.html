<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge - Room</title>
    <link rel="stylesheet" href="room.css" />
  </head>
  <body>
    <header class="room-header">
      <h1 id="roomTitle">방 제목 로딩중...</h1>
      <p id="roomCreator" class="creator"></p>
    </header>

    <main class="room-main">
      <!-- 좌측 코드 입력 영역 -->
      <section class="editor-panel">
        <div class="tabs">
          <button class="tab-btn active" data-tab="html">HTML</button>
          <button class="tab-btn" data-tab="css">CSS</button>
          <button class="tab-btn" data-tab="js">JavaScript</button>
        </div>
        <div class="editor-container">
          <textarea id="htmlCode" class="code-tab html-tab"></textarea>
          <textarea id="cssCode" class="code-tab css-tab hidden"></textarea>
          <textarea id="jsCode" class="code-tab js-tab hidden"></textarea>
        </div>
      </section>

      <!-- 우측 미리보기 -->
      <section class="preview-panel">
        <button class="pv-btn">미리보기</button>
        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </section>
    </main>

    <div class="room-controls">
      <div class="button-group">
        <button id="leaveRoomBtn">🔙 방 나가기</button>
        <button id="deleteRoomBtn" class="hidden">🗑 방 삭제</button>
      </div>
    </div>

    <script src="room.js"></script>
  </body>
</html>

</html>
