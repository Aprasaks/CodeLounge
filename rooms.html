<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge - Code Rooms</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="rooms-container">
      <div class="container">
        <h1>CodeLounge</h1>
        <h2>코드방 목록</h2>

        <!-- 방 생성 -->
        <div class="create-romm">
          <input type="text" id="roomTitleInput" placeholder="방 제목을 지어주세요." />
          <button id="createRoomBtn">방 만들기</button>
        </div>

        <!-- 방 목록 추가 -->
        <ul id="roomList" class="room-list"></ul>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
