<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge - Rooms</title>
    <link rel="stylesheet" href="rooms.css" />
  </head>
  <body>
    <!-- 상단 헤더 -->
    <header class="header">
      <div class="logo">CodeLounge</div>
      <div class="user-actions">
        <span class="username">aprasaks</span>
        <button id="logoutBtn">로그아웃</button>
        <button id="toggleCreateBtn">방 만들기</button>
      </div>
    </header>

    <!-- 슬라이드 인풋 영역 -->
    <section id="createRoomSlide" class="create-room-slide hidden">
      <input type="text" id="roomTitleInput" placeholder="방 제목을 입력하세요." />
      <button id="addRoomBtn">추가</button>
    </section>

    <!-- 코드방 카드 리스트 -->
    <main class="room-grid-container">
      <ul id="roomList" class="room-grid"></ul>
    </main>

    <script src="rooms.js"></script>
  </body>
</html>
