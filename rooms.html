<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeLounge - Code Rooms</title>
    <link rel="stylesheet" href="rooms.css" />
  </head>
  <body>
    <div class="rooms-container">
      <div class="logo-box">CodeLounge</div>

      <!-- 방 생성 & 목록 영역 -->
      <div class="rooms-main">
        <!-- 왼쪽: 방 생성 영역 -->
        <div class="create-room-box">
          <h2>코드방 목록</h2>
          <input type="text" id="roomTitleInput" placeholder="방 제목을 지어주세요." />
          <button id="createRoomBtn">방 만들기</button>
        </div>

        <!-- 오른쪽: 방 리스트 -->
        <div class="room-list-wrapper">
          <ul class="room-list" id="roomList"></ul>
        </div>
      </div>
    </div>

    <!-- 스크립트 -->
    <script src="script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const user = localStorage.getItem("loggedInUser");
        if (!user) {
          alert("로그인이 필요한 페이지입니다.");
          window.location.href = "login.html";
        }
      });
    </script>
  </body>
</html>
